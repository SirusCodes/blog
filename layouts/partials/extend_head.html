{{- if hugo.IsProduction | or (eq site.Params.env "production") }}

  async
  defer
  src="https://analytics.darshanrander.com/script.js"
  data-website-id="900abcb8-7747-4813-8b7d-9fa5caebe82c"
></script>
{{- end -}} 

{{ if .Store.Get "hasMermaid" }}
<script type="module">
  var theme = 'neutral';

  if (localStorage.getItem("pref-theme") == "dark") {
    theme = 'dark'
  } else if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
    theme = 'dark'
  }

  import mermaid from 'https://cdnjs.cloudflare.com/ajax/libs/mermaid/12.3.0/mermaid.esm.min.mjs';
  mermaid.initialize({
    startOnLoad: true,
    'theme': theme,
  });
</script>
{{ end }}
